name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest cryptography
      - name: Validate spec integrity
        run: python scripts/validate_skills.py
      - name: Run executable tests
        run: python -m pytest tests/ -v
      - name: Debug: list failures + key errors (TEMP)
        run: |
          echo "===== FAILED TESTS ====="
          python -m pytest tests/ -q 2>&1 | grep -E "FAILED|ERROR" || echo "(none reported)"
          echo "===== TAIL OF LAST RUN ====="
          python -m pytest tests/ -q 2>&1 | tail -40 || true
          echo "===== ENV CHECK ====="
          echo "GITHUB_TOKEN set: $([ -n "$GITHUB_TOKEN" ] && echo yes || echo no)"
          echo "OPENAI_API_KEY set: $([ -n "$OPENAI_API_KEY" ] && echo yes || echo no)"
          echo "AGNES_API_KEY set: $([ -n "$AGNES_API_KEY" ] && echo yes || echo no)"
          python -c "import sys; print('python', sys.version)"
